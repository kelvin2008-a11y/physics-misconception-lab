ontology_schema:
  name: PhysicsMisconceptionLearningSession
  description: A learner's problem and solution submission, transient API configuration,
    evidence-based Korean diagnosis, guided hints, retry attempt, optional teacher
    review, and privacy-filtered export.
  fields:
  - name: problem
    type: object
    description: Problem text and supported image attachments, with optional teacher
      rubric or reference.
    required: true
  - name: solution
    type: object
    description: Separate handwritten solution attachments and optional typed solution.
    required: true
  - name: attachments
    type: array
    description: Images with input role, format, size, preview, and resized representation;
      contents are untrusted data.
    required: true
  - name: apiConfiguration
    type: object
    description: Editable model and transient personal API key held only in memory
      and excluded from serialization.
    required: true
  - name: analysisState
    type: string
    description: Current input, loading, completed, cancelled, or error state.
    required: true
  - name: diagnosis
    type: object
    description: Korean transcription, correct parts, evidence-linked findings, confidence,
      and any abstention.
    required: true
  - name: findings
    type: array
    description: Conceptual, algebra, unit, or omission findings supported by quotations
      or locations, including force-role reasoning when relevant.
    required: true
  - name: hints
    type: array
    description: Three hints revealed progressively.
    required: true
  - name: referenceSolution
    type: string
    description: Optional full solution revealed at the learner's request.
    required: true
  - name: retry
    type: object
    description: Generated retry question, learner answer, and API-based answer recheck.
    required: true
  - name: teacherReview
    type: object
    description: Optional acceptance or correction of the diagnosis.
    required: true
  - name: usage
    type: object
    description: Actual token usage returned by the API, when available.
    required: true
  - name: syntheticProvenance
    type: object
    description: Explicit synthetic labeling for the local demo and any optional imported
      cases.
    required: true
  - name: exportPreview
    type: object
    description: Content proposed for JSON or print export with keys and images excluded
      and identifying text minimized where possible.
    required: true
evaluation_principles:
- name: Diagnostic correctness and grounding
  description: Evaluate Korean feedback against problem and solution evidence, error-category
    distinctions, force-role reasoning, and appropriate uncertainty or abstention.
  weight: 0.3
- name: Privacy and request integrity
  description: Verify memory-only key handling, direct documented multimodal requests,
    strict validation, attachment distrust, and privacy-filtered exports.
  weight: 0.25
- name: Learning usability
  description: Evaluate accessible responsive Korean interaction, progressive hints,
    retry learning, and optional teacher correction.
  weight: 0.2
- name: Honest behavior and verification
  description: Require meaningful targeted unit/mock and browser evidence, truthful
    error and usage reporting, explicit synthetic provenance, and clear separation
    of mocked from live verification.
  weight: 0.15
- name: Delivery readiness
  description: Evaluate static subpath compatibility, Korean documentation, asset-only
    Pages workflow, preservation of original files, and absence of unauthorized publication.
  weight: 0.1
exit_conditions:
- name: Verified implementation
  criteria: All ten targeted commands and the full project test runner pass; no paid
    request or publication occurs.
