services:
  - type: web
    name: physics-diagnosis-api
    runtime: node
    plan: free
    rootDir: outputs/physics-lab
    buildCommand: node --check server/server.mjs
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: OPENAI_API_KEY
        sync: false
      - key: ALLOWED_ORIGIN
        sync: false
